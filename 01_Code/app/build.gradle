plugins {
    id 'com.android.application'
}

android {
    namespace 'com.beigel.screenTracker'
    compileSdk 35

    defaultConfig {
        applicationId "com.beigel.screenTracker"
        minSdk 27
        targetSdk 35
        versionCode 6  // Erhöht für aufgeräumte Version
        versionName "1.3.0"  // Neue Version für Refactoring

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Vector-Drawables aktivieren
        vectorDrawables.useSupportLibrary = true
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            debuggable true
            // Besseres Debugging für aufgeräumte Version
            minifyEnabled false
            manifestPlaceholders = [
                    app_name: "@string/app_name_debug"
            ]
        }

        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            manifestPlaceholders = [
                    app_name: "@string/app_name"
            ]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11

        // Java 8+ Features für besseren Code (optional)
        // coreLibraryDesugaringEnabled true // Auskommentiert für Kompatibilität
    }

    buildFeatures {
        viewBinding true  // View Binding aktivieren
        buildConfig true  // BuildConfig für AppConstants
    }

    // Lint-Konfiguration für sauberen Code
    lintOptions {
        checkReleaseBuilds false
        abortOnError false
        disable 'MissingTranslation'
        enable 'LogConditional', 'LogUsage'
    }

    // Bessere Test-Konfiguration
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    // Desugar Library für Java 8+ Features (optional)
    // coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'

    // Core Android Libraries (Updated)
    implementation 'androidx.core:core:1.16.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.lifecycle:lifecycle-common:2.8.7'

    // UI-Komponenten (Updated)
    implementation 'com.google.android.material:material:1.12.0'
    implementation "com.github.skydoves:colorpickerview:2.3.0"

    // Annotations für besseren Code
    implementation 'androidx.annotation:annotation:1.9.1'

    // Optional: Verbessertes Logging (für Production entfernen)
    debugImplementation 'com.jakewharton.timber:timber:5.0.1'

    // Test-Bibliotheken (Erweitert für neuen Code)
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.8.0'
    testImplementation 'org.robolectric:robolectric:4.11.1'

    // Android Instrumentation Tests
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'

    // UI Testing
    androidTestImplementation 'androidx.test.espresso:espresso-contrib:3.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-intents:3.7.0'
}