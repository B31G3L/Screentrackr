<body class="flex text-center"> <!-- Flex container for centering content -->

      <div id="config-panel">

            </div>
            
            <div class="setting-row">
              <div class="setting-label">Marker Color</div>
              <input id="MarkerColor" name="MarkerColor" type="color" value="#646464" class="bg-transparent border-none w-8 h-8 cursor-pointer p-0">
            </div>

            <div class="mt-4">
              <label id="brightnessLabel" for="brightnessInput" class="text-xs text-slate-400 mb-2 block uppercase font-bold tracking-wider">Brightness</label>
              <input id="brightnessInput" type="range" class="range range-primary range-xs" min="1" max="200" value="100">

          <!-- Card: Marker Pattern -->

              Marker Pattern
            </h3>
            
            <div class="setting-row">
              <div class="setting-label">Density</div>
              <select id="MarkerDensity" name="MarkerDensity" class="select select-xs min-w-[80px]">
                <option value="0">0</option>
                <option value="1" selected>1</option>
                <option value="2">2</option>
                <option value="3">3</option>
              </select>
            </div>

            <div class="setting-row">
              <div class="setting-label">Size</div>
              <select id="MarkerSize" name="MarkerSize" class="select select-xs min-w-[80px]">

                <option value="2" selected>2</option>
                <option value="3">3</option>
                <option value="4">4</option>

            </div>

            <div class="setting-row">

  <!-- Inline script to initialize Cookie Consent and Iframe Manager -->
  <script>
    // Wait for the page to load before initializing scripts
    window.addEventListener('load', function () {
      // Initialize Cookie Consent
      const cc = initCookieConsent();
      // Initialize Iframe Manager
      const manager = iframemanager();
      // Toggle a theme class (optional)
      document.body.classList.toggle('theme_screentrackr');

      // Configure Iframe Manager
      manager.run({
        currLang: 'en', // Set current language
        services: {
          // Configuration for YouTube embeds
          youtube: {
            embedUrl: 'https://www.youtube-nocookie.com/embed/{data-id}?rel=0', // YouTube embed URL template
            thumbnailUrl: 'https://img.youtube.com/vi/{data-id}/hqdefault.jpg', // YouTube thumbnail URL template
            iframe: {
              allow: 'accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen;', // Permissions for the iframe
            },
            cookie: {
              name: 'cc_youtube' // Associated cookie name (optional)
            },
            languages: { // Language-specific text for the consent overlay
              en: {
                notice: 'This content is hosted by a third party. By showing the external content you accept the <a rel="noreferrer" href="https://www.youtube.com/t/terms" title="Terms and conditions" target="_blank">terms and conditions</a> of youtube.com.',
                loadBtn: 'Load video',
                loadAllBtn: 'Don\'t ask again'
              }
            }
          }
          // Add configurations for other services (Vimeo, etc.) here
        }
      });

      // Configure Cookie Consent
      cc.run({
        current_lang: 'en', // Set current language
        revision: 2, // Increment revision number because we changed the default marker type and UI
        autoclear_cookies: true, // Automatically clear cookies if consent is revoked
        cookie_expiration: 31, // Cookie expiration in days
        page_scripts: true, // Enable handling of scripts based on consent
        gui_options: {
          consent_modal: {
            layout: 'cloud', // Layout style for the consent modal
          }
        },

        // Callback function when consent is given
        onAccept: function () {
          // If 'external' category is allowed, accept all services managed by iframemanager
          if (cc.allowedCategory('external'))
            manager.acceptService('all');
        },

        // Callback function when consent changes
        onChange: function () {
          // If 'external' category is no longer allowed, reject all services managed by iframemanager
          if (!cc.allowedCategory('external'))
            manager.rejectService('all');
        },

        // Language configuration for the cookie consent UI
        languages: {
          en: {
            consent_modal: {
              title: "We use cookies",
              description: 'We use cookies on our website. Some of them are essential, while others help us to improve this website and your experience. <button type="button" data-cc="c-settings" class="cc-link">Manage preferences</button>',
              primary_btn: {
                text: 'Accept all',
                role: 'accept_all' // Button accepts all categories
              },
              secondary_btn: {
                text: 'Accept only necessary',
                role: 'accept_necessary' // Button accepts only necessary cookies
              }
            },
            settings_modal: {
              title: 'Cookie settings',
              save_settings_btn: "Save settings",
              accept_all_btn: "Accept all",
              reject_all_btn: "Reject all",
              close_btn_label: "Close",
              // Define cookie categories
              blocks: [{
                title: "Cookie usage",
                description: 'Here you will find an overview of all cookies used. For more details about cookies and how they are used, read the full <a href="../privacy">privacy policy</a>',
              }, {
                title: "Essential cookies",
                description: 'Essential cookies enable basic functions and are necessary for the proper function of the website.',
                toggle: {
                  value: 'necessary', // Category identifier
                  enabled: true,      // Enabled by default
                  readonly: true      // User cannot disable
                }
              }, {
                title: "Statistics",
                description: 'Statistics cookies collect information anonymously. This information helps us to understand how our visitors use our website. All data is anonymized and cannot be used to identify you.',
                toggle: {
                  value: 'statistics', // Category identifier for Google Analytics
                  enabled: false,     // Disabled by default
                  readonly: false     // User can enable/disable
                }
              }, {
                title: "External media",
                description: 'Content from video platforms and social media platforms is blocked by default. If external media cookies are accepted, access to those contents no longer requires manual consent.',
                toggle: {
                  value: 'external', // Category identifier for iframemanager services
                  enabled: false,   // Disabled by default
                  readonly: false   // User can enable/disable
                }
              }, ]
            }
          }
          // Add configurations for other languages here
        }
      });
    });
  </script>
